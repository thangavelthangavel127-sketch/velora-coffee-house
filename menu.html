<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velora Coffee - Menu</title>

<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<header class="header">

<div class="logo">

<img src="images/logo.png">

<h2>Velora Coffee</h2>

</div>

<nav>

<a href="home.html">Home</a>

<a href="menu.html">Menu</a>

<a href="cart.html">

<i class="fa-solid fa-cart-shopping"></i>

Cart

</a>

</nav>

</header>

<section class="menu">

<h1>Our Coffee Menu</h1>

<div class="menu-container" id="menuContainer">
    <p style="text-align:center; width:100%;">Loading menu...</p>
</div>

</section>

<script>

const API = "http://127.0.0.1:3000";

async function loadMenu() {
    const container = document.getElementById("menuContainer");

    try {
        const res = await fetch(`${API}/api/products`);
        const data = await res.json();

        if (!data.success || !data.products.length) {
            container.innerHTML = "<p style='text-align:center; width:100%;'>No items available right now.</p>";
            return;
        }

        container.innerHTML = "";

        data.products.forEach(function(p) {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
                <img src="${p.image || 'images/logo.png'}">
                <h3>${p.name}</h3>
                <p>₹${p.price}</p>
                <button onclick='addCart(${JSON.stringify(p.name)}, ${p.price}, ${JSON.stringify(p.image || "")})'>Add to Cart</button>
            `;
            container.appendChild(card);
        });

    } catch (error) {
        console.error(error);
        container.innerHTML = "<p style='text-align:center; width:100%; color:red;'>Cannot load menu. Please start the backend server.</p>";
    }
}

loadMenu();

function addCart(name, price, image){

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    let item = cart.find(i => i.name === name);

    if(item){
        item.qty++;
    }else{
        cart.push({
            name: name,
            price: price,
            image: image,
            qty: 1
        });
    }

    localStorage.setItem("cart", JSON.stringify(cart));

    // Directly go to Cart page
    window.location.href = "cart.html";
}

</script>

</body>
</html>
