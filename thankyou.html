<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You | Velora Coffee</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:linear-gradient(135deg,#6f4e37,#b08968);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.card{
    width:80%;
    max-width:600px;
    background:#fff;
    border-radius:20px;
    padding:30px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.icon{
    width:60px;
    height:60px;
    margin:auto;
    background:#28a745;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:45px;
    color:#fff;
}

h1{
    color:#28a745;
    margin-top:20px;
    font-size:34px;
}

h3{
    color:#555;
    margin-top:10px;
    margin-bottom:20px;
}

.order{
    background:#f5f5f5;
    padding:20px;
    border-radius:12px;
    text-align:left;
    margin-top:20px;
}

.order p{
    margin:12px 0;
    font-size:18px;
}

.message{
    margin-top:25px;
    color:#555;
    line-height:30px;
    font-size:18px;
}

.btn{
    margin-top:25px;
    padding:14px 35px;
    background:#6f4e37;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

.btn:hover{
    background:#4b3125;
}

</style>
</head>

<body>

<div class="card">

<div class="icon">
✔
</div>

<h1>Order Delivered Successfully!</h1>

<h3>Thank You for Choosing Velora Coffee ☕</h3>

<div class="order">

<p><b>Order ID :</b> VC1025</p>

<p><b>Customer :</b> <span id="customer"></span></p>

<p><b>Payment Method :</b> <span id="payment"></span></p>

<p><b>Delivery Status :</b>
<span style="color:green;">completed ✓</span>
</p>

<p><b>Estimated Delivery :</b> 20 - 30 Minutes</p>

</div>

<div class="message">

❤️ We hope you enjoyed your coffee.<br><br>

Thank you for your order.<br>

Visit Again!

</div>

<button class="btn" onclick="goHome()">
Back To Home
</button>

</div>

<script>

let order = JSON.parse(localStorage.getItem("orderDetails")) || {};

document.getElementById("customer").innerHTML =
order.name || "Customer";

document.getElementById("payment").innerHTML =
localStorage.getItem("paymentMethod") || "Cash On Delivery";

function goHome(){

localStorage.removeItem("cart");

window.location.href="home.html";

}

</script>

</body>
</html>
