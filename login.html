<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Velora Coffee</title>

<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
.role-tabs {
    display: flex;
    margin-bottom: 20px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid #ccc;
}
.role-tab {
    flex: 1;
    padding: 12px;
    text-align: center;
    cursor: pointer;
    background: #f0f0f0;
    font-weight: bold;
    transition: 0.2s;
}
.role-tab.active {
    background: #6f4e37;
    color: #fff;
}
</style>
</head>
<body>

<div class="login-container">

    <div class="login-box">

        <img src="images/logo.png" class="login-logo">

        <h2>Welcome to Velora Coffee</h2>

        <p>Sign in to continue your coffee journey ☕</p>

        <div class="role-tabs">
            <div class="role-tab active" id="userTab" onclick="selectRole('user')">User Login</div>
            <div class="role-tab" id="adminTab" onclick="selectRole('admin')">Admin Login</div>
        </div>

        <form id="loginForm">

            <!-- Name -->
            <div class="input-box">
                <i class="fa-solid fa-user"></i>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter Your Name"
                    required>
            </div>

            <!-- Email -->
            <div class="input-box">
                <i class="fa-solid fa-envelope"></i>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter Email"
                    required>
            </div>

            <!-- Password -->
            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                    required>
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

            <p id="loginMessage"></p>

        </form>

        <p style="text-align:center; margin-top:15px;">
            New here? <a href="register.html" style="color:#6f4e37; font-weight:bold;">Create an account</a>
        </p>

    </div>

</div>

<script>

const API = (location.hostname === "127.0.0.1" || location.hostname === "localhost")
    ? "http://127.0.0.1:3000"
    : "";

let selectedRole = "user";

function selectRole(role) {
    selectedRole = role;
    document.getElementById("userTab").classList.toggle("active", role === "user");
    document.getElementById("adminTab").classList.toggle("active", role === "admin");
}

document.getElementById("loginForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const message = document.getElementById("loginMessage");

    message.textContent = "Logging in...";

    try {

        const response = await fetch(`${API}/api/login`, {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                email: email,
                password: password
            })

        });

        const data = await response.json();

        if (data.success) {

            // Check that the account role matches the selected tab
            if (selectedRole === "admin" && data.user.role !== "admin") {
                message.style.color = "red";
                message.textContent = "This is not an admin account. Please use User Login.";
                return;
            }

            if (selectedRole === "user" && data.user.role === "admin") {
                message.style.color = "red";
                message.textContent = "This is an admin account. Please use Admin Login.";
                return;
            }

            // Save login information
            localStorage.setItem("token", data.token);
            localStorage.setItem("customerName", data.user.name);
            localStorage.setItem("customerEmail", data.user.email);
            localStorage.setItem("userId", data.user.id);
            localStorage.setItem("userRole", data.user.role);

            message.style.color = "green";
            message.textContent = "Login successful!";

            // Go to admin dashboard or home page based on role
            setTimeout(function() {
                if (data.user.role === "admin") {
                    window.location.href = "admin.html";
                } else {
                    window.location.href = "home.html";
                }
            }, 500);

        } else {

            message.style.color = "red";
            message.textContent = data.message;

        }

    } catch (error) {

        console.error(error);

        message.style.color = "red";
        message.textContent =
            "Cannot connect to server. Please start the backend.";

    }

});

</script>

</body>
</html>
