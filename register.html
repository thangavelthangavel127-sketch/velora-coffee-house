<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register - Velora Coffee</title>

<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="login-container">

    <div class="login-box">

        <img src="images/logo.png" class="login-logo">

        <h2>Create Your Account</h2>

        <p>Join Velora Coffee ☕</p>

        <form id="registerForm">

            <div class="input-box">
                <i class="fa-solid fa-user"></i>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter Your Name"
                    required>
            </div>

            <div class="input-box">
                <i class="fa-solid fa-envelope"></i>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter Email"
                    required>
            </div>

            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input
                    type="password"
                    id="password"
                    placeholder="Create Password"
                    required>
            </div>

            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm Password"
                    required>
            </div>

            <button type="submit" class="login-btn">
                Register
            </button>

            <p id="registerMessage"></p>

        </form>

        <p style="text-align:center; margin-top:15px;">
            Already have an account? <a href="login.html" style="color:#6f4e37; font-weight:bold;">Login here</a>
        </p>

        <p>
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>

</div>

<script>

const API = (location.hostname === "127.0.0.1" || location.hostname === "localhost")
    ? "http://127.0.0.1:3000"
    : "";

document.getElementById("registerForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    const message = document.getElementById("registerMessage");

    if (password !== confirmPassword) {

        message.style.color = "red";
        message.textContent = "Passwords do not match!";
        return;

    }

    message.style.color = "";
    message.textContent = "Creating account...";

    try {

        const response = await fetch(`${API}/api/register`, {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                name: name,
                email: email,
                password: password
            })

        });

        const data = await response.json();

        if (data.success) {

            message.style.color = "green";
            message.textContent = "Registration successful!";

            setTimeout(function() {
                window.location.href = "login.html";
            }, 1000);

        } else {

            message.style.color = "red";
            message.textContent = data.message;

        }

    } catch (error) {

        console.error(error);

        message.style.color = "red";
        message.textContent =
            "Cannot connect to server. Please start the backend.";

    }

});

</script>

</body>
</html>
